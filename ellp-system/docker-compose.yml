services:
  db:
    image: postgres:16-alpine
    container_name: ellp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ellp
      POSTGRES_PASSWORD: ellp123
      POSTGRES_DB: ellp_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ellp -d ellp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ellp-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://ellp:ellp123@db:5432/ellp_dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
